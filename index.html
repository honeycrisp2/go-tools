<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GO Tools</title>
<link rel="stylesheet" href="styles.css">
<style>
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .tool {
    display: block; text-decoration: none; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .tool strong { display: block; font-size: 16px; margin-bottom: 2px; }
  .tool span { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <header class="topbar"><h1>Pokémon GO Tools</h1></header>
  <main>
    <a class="tool" href="type-chart.html">
      <strong>Type Chart</strong>
      <span>GO multipliers, headers stay pinned while you scroll both ways.</span>
    </a>
  </main>
</body>
</html>
