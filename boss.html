<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1c1f25">
<title>Boss Lookup · GO Tools</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<style>
  /* Header + search stay pinned at the top; the rest scrolls like a normal page */
  .head { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
  .head .topbar { border-bottom: 0; padding-bottom: 4px; }
  .searchwrap { padding: 0 12px 10px; }
  .recents { display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 10px; scrollbar-width: none; }
  .recents:empty { display: none; }
  .recents button.chip { white-space: nowrap; }

  .results { list-style: none; margin: 0; padding: 0; }
  .results button {
    display: flex; width: 100%; align-items: center; gap: 8px; text-align: left;
    font: inherit; font-size: 16px; color: var(--text);
    background: var(--surface); border: 0; border-bottom: 1px solid var(--border);
    padding: 12px; cursor: pointer;
  }
  .results .dex { color: var(--muted); font-size: 12px; width: 40px; flex: none; }
  .results .name { flex: 1; min-width: 0; }
  .results .pill { font-size: 11px; }

  .card-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 4px 0 4px; }
  .card-h h2 { margin: 0; font-size: 22px; }
  .card-types { display: flex; gap: 4px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); line-height: 1.5; }
  .note { font-size: 12px; color: var(--muted); margin: 10px 0 0; line-height: 1.45; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .atk { list-style: none; margin: 0; padding: 0; }
  .atk li {
    display: grid; grid-template-columns: 24px 1fr auto; gap: 2px 8px; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px; margin-bottom: 6px;
  }
  .atk .rank { color: var(--muted); font-weight: 700; font-size: 13px; grid-row: span 2; text-align: center; }
  .atk .who { font-weight: 700; font-size: 15px; min-width: 0; }
  .atk .tag { font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px; margin-left: 4px; vertical-align: 2px; }
  .tag.shadow { background: #4b2a6b; color: #e6d2ff; }
  .tag.mega { background: #2a4f6b; color: #d2eeff; }
  .atk .dps { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; font-size: 14px; }
  .atk .dps small { display: block; font-weight: 500; color: var(--muted); font-size: 10px; }
  .atk .moves { grid-column: 2 / span 2; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .mv { white-space: nowrap; }
  .mv i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--tc); margin-right: 4px; }
  .mv.elite::after { content: "†"; color: var(--accent); margin-left: 2px; }
  .bar { grid-column: 2 / span 2; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--se); }
  .more { width: 100%; margin-top: 4px; }
  .tag.puri { background: #6b5d2a; color: #fff3cc; }
  .tag.lucky { background: #7a5c00; color: #ffe9a8; }
  .atk .detail { grid-column: 2 / span 2; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .gone { margin-left: auto; font: inherit; font-size: 13px; color: var(--muted); background: none;
          border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; cursor: pointer; }
  .tm { color: var(--accent); font-weight: 600; white-space: nowrap; }
  .find { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .find span { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .find-btn { flex: none; border-color: var(--accent) !important; color: var(--accent) !important; font-weight: 700; }
  .seg { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 3px; margin-bottom: 8px; }
  .seg button { flex: 1; font: inherit; font-size: 14px; font-weight: 600; padding: 8px; border: 0; border-radius: 9px;
                background: none; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .toast { bottom: calc(24px + env(safe-area-inset-bottom)); }
  .toast.show { pointer-events: auto; }
  .toast button { font: inherit; font-weight: 700; color: inherit; background: none; border: 0; text-decoration: underline; margin-left: 6px; cursor: pointer; }
</style>
</head>
<body>
  <div class="head">
    <header class="topbar">
      <a class="back" href="./" aria-label="Back to tools">‹</a>
      <h1>Boss Lookup</h1>
    </header>
    <div class="searchwrap">
      <input type="search" id="q" placeholder="Search Pokémon (e.g. mega gengar)" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="recents" id="recents"></div>
  </div>

  <main id="main"></main>
  <div class="toast" id="toast"></div>

<script src="types.js"></script>
<script src="gamedata.js"></script>
<script src="battle.js"></script>
<script src="collection.js"></script>
<script>
const main = document.getElementById("main");
const q = document.getElementById("q");
const recentsEl = document.getElementById("recents");
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const words = s => norm(s).split(/[^a-z0-9]+/).filter(Boolean);

// Bosses: everything except Shadow duplicates (a Shadow boss has the same types).
const BOSSES = MONS.map((m, i) => ({ i, m, w: words(m[0]), released: m[9] & 4 })).filter(b => !(b.m[9] & 1));
let recents = store.get("boss-recents2", []);
let current = null;
let shown = 15;
const opts = Object.assign({ shadow: true, mega: true, elite: true }, store.get("boss-opts", {}));

const typesOf = m => m[2].map(i => TYPES[i]);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

function search(text) {
  const qw = words(text);
  if (!qw.length) return [];
  if (qw.length === 1 && /^\d+$/.test(qw[0])) return BOSSES.filter(b => b.m[1] === +qw[0]);
  const hits = BOSSES.filter(b => qw.every(x => b.w.some(w => w.startsWith(x))));
  // Exact name start first, released before unreleased, then dex order
  return hits.sort((a, b) =>
    (b.w[0].startsWith(qw[0]) - a.w[0].startsWith(qw[0])) || (b.released - a.released) || (a.m[1] - b.m[1])
  ).slice(0, 50);
}

function showList() {
  const text = q.value.trim();
  if (!text) { current ? showBoss(current, false) : showHome(); return; }
  const list = search(text);
  main.innerHTML = list.length
    ? `<ul class="results">` + list.map(b =>
        `<li><button data-i="${b.i}"><span class="dex">#${b.m[1]}</span><span class="name">${esc(b.m[0])}</span>${typesOf(b.m).map(t => pill(t)).join(" ")}</button></li>`).join("") + `</ul>`
    : `<div class="empty">No Pokémon match “${esc(text)}”.</div>`;
}

function showHome() {
  main.innerHTML = `<div class="empty">Search for a raid boss to see its weaknesses<br>and the best Pokémon to bring.</div>`;
}

let mode = store.get("boss-mode", "all");   // "all" or "mine"

function moveHTML(i, m, guessed) {
  const [name, t] = MOVES[i];
  return `<span class="mv t-${TYPES[t].toLowerCase()}${m[8].includes(i) ? " elite" : ""}"><i></i>${esc(name)}${guessed ? " ?" : ""}</span>`;
}
function tagsHTML(name, flags, r) {
  let t = "";
  if (r ? r.sh === 1 : flags & 1) t += `<span class="tag shadow">SHADOW</span>`;
  if (r && r.sh === 2) t += `<span class="tag puri">PURIFIED</span>`;
  if (r && r.lu) t += `<span class="tag lucky">LUCKY</span>`;
  if (!r && flags & 2) {
    const xy = (name.match(/Mega (X|Y|Z)/) || [])[1];
    t += `<span class="tag mega">${/Primal/.test(name) ? "PRIMAL" : "MEGA"}${xy ? " " + xy : ""}</span>`;
  }
  return t;
}
const baseName = n => n.replace(/ \((Shadow|Mega[^)]*|Primal)\)/, "");

function attackersHTML(boss) {
  const overall = bestOverall(boss, opts);
  const top = overall.length ? overall[0].score ** 0.25 : 1;
  if (mode === "all") {
    if (!overall.length) return `<p class="muted">No attackers found.</p>`;
    const dex = [...new Set(overall.slice(0, 40).map(x => x.m[1]))].slice(0, 25);
    findString = dex.join(",");
    return findHTML("Find my counters in GO", "Copies a search for the top 25 species. Paste it into GO's Pokémon search to see which ones you own.") + `<ol class="atk">` + overall.slice(0, shown).map((x, k) => {
      const pct = Math.round(100 * x.score ** 0.25 / top);
      return `<li><span class="rank">${k + 1}</span>
        <span class="who">${esc(baseName(x.m[0]))}${tagsHTML(x.m[0], x.m[9])}</span>
        <span class="dps">${x.dps.toFixed(1)}<small>DPS</small></span>
        <span class="moves">${moveHTML(x.f, x.m)}${moveHTML(x.c, x.m)}</span>
        <span class="bar"><span style="width:${pct}%"></span></span></li>`;
    }).join("") + `</ol>` + (overall.length > shown ? `<button class="chip more" id="more">Show more</button>` : "");
  }

  const mine = bestMine(boss, opts);
  if (!mine) return `<div class="empty" style="padding:16px">You haven't imported your Pokémon yet.<br>
    <a href="my-pokemon.html">Import your Poke Genie export →</a></div>`;
  if (!mine.length) return `<p class="muted">None of your Pokémon match. Check the filters, or the “ignore old scans” setting on <a href="my-pokemon.html">My Pokémon</a>.</p>`;
  const pick = mine.slice(0, shown);
  findString = [...new Set(pick.map(x => "cp" + x.r.cp))].join(",") + "&" + [...new Set(pick.map(x => x.m[1]))].join(",");
  return findHTML("Find these in GO", "Copies a search for these exact Pokémon (by CP). If one has been powered up since your scan, it won't show.") +
    `<ol class="atk mine">` + pick.map((x, k) => {
    const r = x.r;
    const pct = Math.min(100, Math.round(100 * x.score ** 0.25 / top));
    const iv = r.iv ? r.iv.join("/") : "IVs ?";
    let tm = "";
    if (x.tm) {
      const parts = [];
      if (x.tm.f !== x.f) parts.push(esc(MOVES[x.tm.f][0]));
      if (x.tm.c !== x.c) parts.push(esc(MOVES[x.tm.c][0]));
      tm = `<span class="tm">TM → ${parts.join(" + ")}: +${Math.round(x.tm.gain * 100)}% DPS</span>`;
    }
    return `<li><span class="rank">${k + 1}</span>
      <span class="who">${esc(baseName(r.mon))}${tagsHTML(r.mon, 0, r)}</span>
      <span class="dps">${x.dps.toFixed(1)}<small>DPS</small></span>
      <span class="detail">CP ${r.cp} · Lv ${r.lv} · ${iv}<button class="gone" data-hide="${esc(r.k)}" aria-label="I don't have this anymore">✕</button></span>
      <span class="moves">${moveHTML(x.f, x.m, x.guessFast)}${moveHTML(x.c, x.m, x.guessCh)}${tm}</span>
      <span class="bar" title="${pct}% of the best possible attacker"><span style="width:${pct}%"></span></span></li>`;
  }).join("") + `</ol>` + (mine.length > shown ? `<button class="chip more" id="more">Show more</button>` : "") +
  `<p class="note">Bar = how close each one is to the best possible attacker. “?” = not scanned, so assumed.
    ✕ = you don't have it anymore (undo on <a href="my-pokemon.html">My Pokémon</a>).</p>`;
}

let findString = "";
function findHTML(label, hint) {
  return `<div class="find"><button class="chip find-btn" id="findInGo">⌕ ${label}</button><span>${hint}</span></div>`;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = Object.assign(document.createElement("textarea"), { value: text });
    document.body.append(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  }
}

function filtersHTML() {
  return `<div class="seg">
      <button data-mode="all" aria-pressed="${mode === "all"}">Best overall</button>
      <button data-mode="mine" aria-pressed="${mode === "mine"}">My Pokémon</button>
    </div>
    <div class="filters">
      <button class="chip" data-opt="shadow" aria-pressed="${opts.shadow}">Shadow</button>
      ${mode === "all" ? `<button class="chip" data-opt="mega" aria-pressed="${opts.mega}">Mega / Primal</button>
      <button class="chip" data-opt="elite" aria-pressed="${opts.elite}">Legacy moves †</button>` : ""}
    </div>`;
}
function redrawAttackers() {
  document.getElementById("atkFilters").innerHTML = filtersHTML();
  document.getElementById("atk").innerHTML = attackersHTML(MONS[current]);
}

function showBoss(i, remember = true) {
  current = i;
  const m = MONS[i];
  const t = typesOf(m);
  main.innerHTML = `<div class="page">
    <div class="card-h"><h2>${esc(m[0])}</h2><span class="muted">#${m[1]}</span></div>
    <div class="card-types">${t.map(x => pill(x)).join("")}</div>
    ${matchupHTML(t)}
    <h3 class="mu-h">Best attackers</h3>
    <div id="atkFilters">${filtersHTML()}</div>
    <div id="atk">${attackersHTML(m)}</div>
    <p class="note">Estimates with no weather boost, ranked by damage speed and bulk. “Best overall” assumes level 40
      with perfect IVs. † = Elite TM / legacy move. Shadow bosses have the same types as normal ones.</p>
  </div>`;
  if (remember) {
    recents = [m[0], ...recents.filter(n => n !== m[0])].slice(0, 10);
    store.set("boss-recents2", recents);
    drawRecents();
    scrollTo(0, 0);
  }
}

function drawRecents() {
  const idx = name => MONS.findIndex(m => m[0] === name);
  recents = recents.filter(n => typeof n === "string" && idx(n) >= 0);
  recentsEl.innerHTML = recents.map(n => `<button class="chip" data-i="${idx(n)}">${esc(n)}</button>`).join("");
}

q.addEventListener("input", showList);
q.addEventListener("keydown", e => {
  if (e.key === "Enter") { const r = search(q.value); if (r.length) pick(r[0].i); }
});
function pick(i) { q.value = ""; q.blur(); shown = 15; showBoss(i); }

main.addEventListener("click", e => {
  const b = e.target.closest("button[data-i]");
  if (b) return pick(+b.dataset.i);
  const o = e.target.closest("button[data-opt]");
  if (o) {
    opts[o.dataset.opt] = !opts[o.dataset.opt];
    store.set("boss-opts", opts);
    redrawAttackers();
  }
  const md = e.target.closest("button[data-mode]");
  if (md) { mode = md.dataset.mode; store.set("boss-mode", mode); shown = 15; redrawAttackers(); }
  const h = e.target.closest("button[data-hide]");
  if (h) {
    const set = myStore.hidden(); set.set(h.dataset.hide, Date.now()); myStore.setHidden(set);
    lastHidden = h.dataset.hide;
    redrawAttackers();
    toast(`Marked as gone. <button id="undo">Undo</button>`);
  }
  if (e.target.id === "more") { shown += 15; redrawAttackers(); }
  if (e.target.closest("#findInGo") && findString) {
    copyText(findString).then(ok => toast(ok ? "Copied. Paste it into GO's search." : "Couldn't copy: " + esc(findString)));
  }
});
let lastHidden = null;
function toast(html) {
  const t = document.getElementById("toast");
  t.innerHTML = html; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 6000);
}
document.getElementById("toast").addEventListener("click", e => {
  if (e.target.id !== "undo" || !lastHidden) return;
  const set = myStore.hidden(); set.delete(lastHidden); myStore.setHidden(set);
  lastHidden = null; document.getElementById("toast").classList.remove("show");
  redrawAttackers();
});
recentsEl.addEventListener("click", e => {
  const b = e.target.closest("button[data-i]");
  if (b) pick(+b.dataset.i);
});

drawRecents();
showHome();
</script>
</body>
</html>
