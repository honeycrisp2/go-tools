<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1c1f25">
<title>Dual-Type Calculator · GO Tools</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<style>
  .head { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
  .head .topbar { border-bottom: 0; }
  .picker { padding: 0 12px 10px; }
  .type-grid { grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .type-btn { font-size: 11.5px; padding: 10px 0; border-width: 2px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 359px) { .type-grid { grid-template-columns: repeat(3, 1fr); } }
  .sel-line { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; min-height: 30px; font-size: 14px; }
  .page { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  .sel-line .pill { font-size: 14px; padding: 4px 10px; }
  .sel-line button { margin-left: auto; }
  .empty { padding: 24px 12px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
  <div class="head">
    <header class="topbar">
      <a class="back" href="./" aria-label="Back to tools">‹</a>
      <h1>Dual-Type Calculator</h1>
    </header>
    <div class="picker">
      <div class="type-grid" id="grid"></div>
    </div>
  </div>

  <main class="page">
    <div class="sel-line" id="selLine"></div>
    <div id="out"></div>
  </main>

<script src="types.js"></script>
<script>
const grid = document.getElementById("grid");
const out = document.getElementById("out");
const selLine = document.getElementById("selLine");
let picked = store.get("dual-picked", []).filter(t => TYPES.includes(t)).slice(0, 2);

grid.innerHTML = TYPES.map(t =>
  `<button class="type-btn t-${t.toLowerCase()}" data-t="${t}" aria-pressed="false">${t}</button>`).join("");

function draw() {
  grid.querySelectorAll(".type-btn").forEach(b => b.setAttribute("aria-pressed", picked.includes(b.dataset.t)));
  selLine.innerHTML = picked.length
    ? picked.map(t => pill(t)).join(`<span class="muted">+</span>`) + `<button class="chip" id="clear">Clear</button>`
    : `<span class="muted">Pick one or two defending types</span>`;
  out.innerHTML = picked.length ? matchupHTML(picked)
    : `<div class="empty">Tap the defender's types above to see what beats it.</div>`;
  store.set("dual-picked", picked);
}

grid.addEventListener("click", e => {
  const b = e.target.closest(".type-btn"); if (!b) return;
  const t = b.dataset.t;
  if (picked.includes(t)) picked = picked.filter(x => x !== t);
  else picked = [...picked, t].slice(-2);   // a third pick replaces the oldest
  draw();
});
selLine.addEventListener("click", e => { if (e.target.id === "clear") { picked = []; draw(); } });

draw();
</script>
</body>
</html>
