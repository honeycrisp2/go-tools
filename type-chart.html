<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1c1f25">
<title>Type Chart · GO Tools</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<style>
  :root { --cell: 40px; --label: 78px; --fs: 13px; --hdr: 38px; }

  body.app { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 1fr; }

  /* Landscape phone (or any short window): chart on the left, controls in a side panel */
  @media (orientation: landscape) and (max-height: 560px) {
    body.app { grid-template-columns: 1fr 210px; grid-template-rows: auto 1fr; }
    .topbar { grid-column: 2; grid-row: 1; border-left: 1px solid var(--border); }
    .scroller { grid-column: 1; grid-row: 1 / span 2; }
    .bottombar { grid-column: 2; grid-row: 2; border-left: 1px solid var(--border); border-top: 0;
                 display: flex; flex-direction: column; justify-content: space-between; overflow: auto; }
  }

  .scroller { overflow: auto; overscroll-behavior: contain; min-height: 0; }

  table { border-collapse: separate; border-spacing: 0; font-size: var(--fs); font-variant-numeric: tabular-nums; }
  th, td {
    width: var(--cell); min-width: var(--cell); max-width: var(--cell); height: var(--cellh, var(--cell));
    text-align: center; padding: 0;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  thead th { position: sticky; top: 0; z-index: 2; height: var(--hdr); }
  tbody th { position: sticky; left: 0; z-index: 1; width: var(--label); min-width: var(--label); max-width: var(--label); }
  thead th.corner {
    left: 0; z-index: 3; width: var(--label); min-width: var(--label); max-width: var(--label);
    font-size: 10px; line-height: 1.15; color: var(--muted); text-align: left; padding: 2px 4px;
  }
  .corner b { color: var(--text); }
  th .pill { padding: 4px 0; width: calc(100% - 4px); font-size: 11px; text-align: center; }
  tbody th .pill { font-size: 12px; }
  .fit th .pill { font-size: max(8px, calc(var(--fs) * .85)); padding: 2px 0; border-radius: 3px; }
  .fit thead th.corner { font-size: 8px; padding: 0 2px; }

  th { cursor: pointer; user-select: none; }
  td { font-weight: 600; cursor: pointer; }
  td.se  { background: var(--se-bg);  color: var(--se); }
  td.nve { background: var(--nve-bg); color: var(--nve); }
  td.imm { background: var(--imm-bg); color: var(--imm); }

  td.hl-row, td.hl-col { box-shadow: inset 0 0 0 999px var(--hl); }
  td.hl-cell { box-shadow: inset 0 0 0 999px var(--hl-strong); outline: 2px solid var(--accent); outline-offset: -2px; }
  th.hl { box-shadow: inset 0 0 0 999px var(--hl-strong); }
  td.hover { outline: 2px dashed var(--accent); outline-offset: -2px; }

  .readout { font-size: 14px; min-height: 44px; line-height: 1.6; margin-bottom: 8px; }
  .legend { display: flex; gap: 8px; font-size: 12px; color: var(--muted); margin-left: auto; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }

  /* Tiny windows (pop-up view): trim the chrome */
  @media (max-height: 420px), (max-width: 320px) {
    .topbar { padding: 4px 8px; } .topbar h1 { font-size: 14px; }
    .legend { display: none; }
    .readout { min-height: 0; font-size: 12px; margin-bottom: 4px; }
    .bottombar { padding: 4px 8px; }
    button.chip { padding: 4px 8px; font-size: 12px; }
  }
</style>
</head>
<body class="app">
  <header class="topbar">
    <a class="back" href="./" aria-label="Back to tools">‹</a>
    <h1>Type Chart</h1>
  </header>

  <div class="scroller" id="scroller"><table id="chart"></table></div>

  <div class="bottombar">
    <div class="readout" id="readout"></div>
    <div class="btnrow">
      <button class="chip" id="flip" aria-pressed="false" title="Swap rows and columns">⇄ Flip</button>
      <button class="chip" id="mode" aria-pressed="false">×2 / ½</button>
      <button class="chip" id="fit" aria-pressed="false" title="Shrink the chart to fit the screen">⤢ Fit</button>
      <div class="legend">
        <span><i style="background:var(--se-bg);outline:1px solid var(--se)"></i>1.6</span>
        <span><i style="background:var(--nve-bg);outline:1px solid var(--nve)"></i>.625</span>
        <span><i style="background:var(--imm-bg)"></i>.39</span>
      </div>
    </div>
  </div>

<script src="types.js"></script>
<script>
const GO = { 2: "1.6", 0.5: ".625", 0: ".39", 1: "" };
const CLASSIC = { 2: "×2", 0.5: "½", 0: "¼", 1: "" };
const CLS = { 2: "se", 0.5: "nve", 0: "imm", 1: "" };
const WORDS = { 2: "super effective (1.6×)", 0.5: "not very effective (0.625×)",
                0: "double resisted (0.39×)", 1: "neutral (1×)" };
const HINT = `<span class="muted">Tap a cell to see the matchup. Tap a type to highlight its row/column.</span>`;

let flipped = store.get("tc-flip", false);
let classic = store.get("tc-classic", false);
let sel = null;

const table = document.getElementById("chart");
const scroller = document.getElementById("scroller");
const readout = document.getElementById("readout");
const $ = id => document.getElementById(id);

const isLandscape = () => matchMedia("(orientation: landscape)").matches;
const fitKey = () => isLandscape() ? "tc-fit-land" : "tc-fit-port";
const fitOn = () => store.get(fitKey(), isLandscape());   // default: fit in landscape only

function render() {
  const fit = fitOn();
  const rowLabel = flipped ? "DEF" : "ATK", colLabel = flipped ? "ATK" : "DEF";
  let html = `<thead><tr><th class="corner"><b>${rowLabel}</b> ↓<br><b>${colLabel}</b> →</th>`;
  TYPES.forEach((t, c) => {
    html += `<th data-c="${c}" title="${t}"><span class="pill t-${t.toLowerCase()}">${ABBR[t]}</span></th>`;
  });
  html += `</tr></thead><tbody>`;
  TYPES.forEach((rowT, r) => {
    html += `<tr><th data-r="${r}" title="${rowT}"><span class="pill t-${rowT.toLowerCase()}">${fit ? ABBR[rowT] : rowT}</span></th>`;
    TYPES.forEach((colT, c) => {
      const v = flipped ? tier(colT, rowT) : tier(rowT, colT);
      html += `<td data-r="${r}" data-c="${c}" class="${CLS[v]}">${(classic ? CLASSIC : GO)[v]}</td>`;
    });
    html += `</tr>`;
  });
  table.innerHTML = html + `</tbody>`;
  $("flip").setAttribute("aria-pressed", flipped);
  $("mode").setAttribute("aria-pressed", classic);
  $("fit").setAttribute("aria-pressed", fit);
  size();
  applyHighlight();
  describe();
}

// Work out cell size: fixed when scrolling, computed when "Fit" is on.
function size() {
  const root = document.documentElement.style;
  const fit = fitOn();
  table.classList.toggle("fit", fit);
  if (!fit) {
    ["--cell", "--cellh", "--label", "--fs", "--hdr"].forEach(p => root.removeProperty(p));
    return;
  }
  const W = scroller.clientWidth - 2, H = scroller.clientHeight - 2;
  // 18 rows + header row fill the height; 18 columns + a wider label column fill the width.
  const h = Math.max(14, Math.floor(H / 19));
  const w = Math.max(h, Math.min(Math.floor(h * 2.2), Math.floor(W / 19.5)));
  root.setProperty("--cell", w + "px");
  root.setProperty("--cellh", h + "px");
  root.setProperty("--hdr", h + "px");
  root.setProperty("--label", Math.max(Math.floor(w * 1.5), 34) + "px");
  root.setProperty("--fs", Math.max(8, Math.round(Math.min(h * 0.5, w * 0.32))) + "px");
}

function applyHighlight() {
  table.querySelectorAll(".hl-row,.hl-col,.hl-cell,.hl").forEach(el =>
    el.classList.remove("hl-row", "hl-col", "hl-cell", "hl"));
  if (!sel) return;
  const {r, c} = sel;
  if (r != null) {
    table.querySelectorAll(`td[data-r="${r}"]`).forEach(el => el.classList.add("hl-row"));
    table.querySelector(`tbody th[data-r="${r}"]`).classList.add("hl");
  }
  if (c != null) {
    table.querySelectorAll(`td[data-c="${c}"]`).forEach(el => el.classList.add("hl-col"));
    table.querySelector(`thead th[data-c="${c}"]`).classList.add("hl");
  }
  if (r != null && c != null) table.querySelector(`td[data-r="${r}"][data-c="${c}"]`).classList.add("hl-cell");
}

function describe(s = sel) {
  if (!s) { readout.innerHTML = HINT; return; }
  const {r, c} = s;
  const atkIdx = flipped ? c : r, defIdx = flipped ? r : c;
  if (r != null && c != null) {
    const atk = TYPES[atkIdx], def = TYPES[defIdx];
    readout.innerHTML = `${pill(atk)} attacking ${pill(def)} is <b>${WORDS[tier(atk, def)]}</b>`;
  } else if (atkIdx != null) {
    const atk = TYPES[atkIdx];
    const strong = TYPES.filter(d => tier(atk, d) === 2);
    readout.innerHTML = `${pill(atk)} hits hard: ` + (strong.length ? strong.map(t => pill(t)).join(" ") : `<span class="muted">nothing</span>`);
  } else {
    const def = TYPES[defIdx];
    readout.innerHTML = `${pill(def)} is weak to: ` + TYPES.filter(a => tier(a, def) === 2).map(t => pill(t)).join(" ");
  }
}

table.addEventListener("click", e => {
  const cell = e.target.closest("td, th");
  if (!cell || cell.classList.contains("corner")) sel = null;
  else {
    const r = cell.dataset.r != null ? +cell.dataset.r : null;
    const c = cell.dataset.c != null ? +cell.dataset.c : null;
    sel = sel && sel.r === r && sel.c === c ? null : {r, c};
  }
  applyHighlight(); describe();
});

// S Pen / mouse hover: preview a cell's matchup without tapping.
let hovered = null;
table.addEventListener("pointermove", e => {
  if (e.pointerType === "touch") return;
  const td = e.target.closest("td");
  if (td === hovered) return;
  hovered?.classList.remove("hover");
  hovered = td;
  if (td) { td.classList.add("hover"); describe({r: +td.dataset.r, c: +td.dataset.c}); }
  else describe();
});
table.addEventListener("pointerleave", () => { hovered?.classList.remove("hover"); hovered = null; describe(); });

$("flip").addEventListener("click", () => {
  flipped = !flipped; store.set("tc-flip", flipped);
  if (sel) sel = {r: sel.c, c: sel.r};
  render();
});
$("mode").addEventListener("click", () => { classic = !classic; store.set("tc-classic", classic); render(); });
$("fit").addEventListener("click", () => { store.set(fitKey(), !fitOn()); render(); });

let wasLandscape = isLandscape();
new ResizeObserver(() => {
  if (isLandscape() !== wasLandscape) { wasLandscape = isLandscape(); render(); }
  else size();
}).observe(scroller);

render();
</script>
</body>
</html>
